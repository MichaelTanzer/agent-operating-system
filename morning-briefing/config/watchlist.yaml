source_quality_taxonomy:
  source_rubric_path: morning-briefing/config/source_rubric.yaml
  summary:
    tier1_primary: "Filings, earnings, investor presentations, regulator notices, and official company disclosures."
    tier2_verified_business_press: "Independent reporting from Reuters/Bloomberg/WSJ/FT and reputable sector trade press."
    tier3_expert_research_and_white_papers: "Consulting, rating-agency, association, and specialist research used for context."
    tier4_specialist_blogs_and_newsletters: "Practitioner commentary requiring corroboration."
    tier5_low_quality_or_noise: "Automated stock pages, content farms, social rumors, and rewrites; exclude by default."

consulting_white_paper_query_patterns:
  global:
    - '"{sector_label}" "white paper" pricing margin regulation automation'
    - '"{sector_label}" McKinsey OR BCG OR Bain OR Deloitte OR PwC OR EY OR KPMG outlook'
    - '"{sector_label}" "market structure" "consolidation" "pricing power"'
    - '"{company}" "case study" "operating model" "network"'
  logistics:
    - 'LTL freight pricing tonnage yield terminal network automation white paper'
    - 'freight forwarding air ocean rates contract logistics automation outlook'
    - '3PL outsourcing warehouse automation inventory destocking restocking survey'
  insurance_broking:
    - 'commercial insurance rate environment casualty property reinsurance broker commission outlook'
    - 'insurance brokerage organic growth fiduciary investment income E&S wholesale report'
    - 'employee benefits consulting human capital risk advisory margin survey'
  tic:
    - 'testing inspection certification regulation accreditation standards outsourcing report'
    - 'TIC laboratory testing PFAS ESG supply chain assurance cybersecurity certification white paper'
    - 'product safety certification ISO IEC UL standards compliance outlook'

low_quality_noise_exclusions:
  - automated_stock_price_recaps
  - analyst_price_target_only
  - zacks_rank_or_factor_score_only
  - marketbeat_or_simplywallst_roundups
  - duplicated_press_release_rewrites
  - generic_market_size_listicles
  - sponsored_vendor_posts_without_original_data
  - social_media_rumors_without_primary_source
  - conference_attendance_notices_without_new_content
  - local_awards_or_charity_items_without_business_signal
  - ETF_or_index_mentions_without_company_specific_fact
